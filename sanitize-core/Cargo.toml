[package]
name = "sanitize-core"
version = "0.8.0"
edition = "2021"
description = "Deterministic, fuzzable image decode + pixel transforms + container strip/audit for STOPTRACKINGME. Compiles to WASM; one allowlist shared by strip and audit."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = { version = "5", default-features = false }
kamadak-exif = "0.6"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Os', '--enable-bulk-memory', '--enable-nontrapping-float-to-int', '--enable-sign-ext', '--enable-mutable-globals', '--enable-simd']
